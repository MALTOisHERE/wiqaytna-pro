# Wiqaytna Pro - Application Configuration
# All sensitive values are externalized to .env file

# Application Info
spring.application.name=wiqaytna-pro
server.port=${SERVER_PORT:8080}

# Database Configuration (PostgreSQL)
# Uses environment variables from .env file
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wiqaytna_db}?stringtype=unspecified
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.use_sql_comments=true

# Jackson Configuration (JSON serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Casablanca

# JWT Configuration
# IMPORTANT: Use strong random secret in production (minimum 256 bits)
jwt.secret=${JWT_SECRET:wiqaytna_secret_key_change_this_in_production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
# Comma-separated list of allowed origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.wiqaytna=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Error Handling
server.error.include-message=always
server.error.include-stacktrace=on_param

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# SMS Service Configuration
sms.enabled=${SMS_ENABLED:false}
sms.mock-mode=${SMS_MOCK_MODE:true}

# Scheduler Configuration
scheduler.reminder.enabled=${SCHEDULER_REMINDER_ENABLED:true}
scheduler.reminder.cron=${SCHEDULER_REMINDER_CRON:0 0 * * * *}
