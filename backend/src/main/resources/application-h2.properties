# H2 Database Configuration Profile
# To use this profile, run: mvn spring-boot:run -Dspring-boot.run.profiles=h2

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:wiqaytna_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (web UI to view database)
# Access at: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA/Hibernate Configuration for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Note: Data will be lost when application stops (in-memory database)
# For persistent H2 database, use: jdbc:h2:file:./data/wiqaytna_db
